name: Zone Backend CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: zone-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: mix test
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test
      # The test database is a weft_fdb one: SQLite in the BEAM, its pages in FoundationDB.
      TEST_DATABASE: "file:uro_test.v1?vfs=weft_fdb"
      WEFT_FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
      URO_WEFTFDB_EXTENSION: ${{ github.workspace }}/datasource-store/build/weftfdb
      STORE_REF: 39d1f32c2becf564365c667379bd045cd5381264

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Cache Mix deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-zone-backend-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-zone-backend-mix-

      - name: Start a single-node FoundationDB
        run: |
          curl -fsSLO https://github.com/apple/foundationdb/releases/download/7.3.63/foundationdb-clients_7.3.63-1_amd64.deb
          curl -fsSLO https://github.com/apple/foundationdb/releases/download/7.3.63/foundationdb-server_7.3.63-1_amd64.deb
          sudo dpkg -i foundationdb-clients_7.3.63-1_amd64.deb foundationdb-server_7.3.63-1_amd64.deb
          timeout 120 bash -c 'until fdbcli --exec "status minimal" --timeout 5 | grep -q "available"; do sleep 2; done'

      - name: Check out datasource-store at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: V-Sekai-fire/datasource-store
          ref: ${{ env.STORE_REF }}
          path: datasource-store

      - name: Build the weftfdb extension
        working-directory: datasource-store
        run: |
          sudo apt-get install -y -q cmake libsqlite3-dev
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target weftfdb
          ls -la build/weftfdb.so

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        run: |
          mix ecto.migrate
          mix run priv/repo/test_seeds.exs
          mix test --trace

      - name: The test database lives in FoundationDB
        run: |
          keys=$(fdbcli --exec "getrangekeys weft/db/uro_test.v1/ weft/db/uro_test.v10 100" | grep -c "weft/db/uro_test.v1/")
          echo "FoundationDB keys under weft/db/uro_test.v1/: $keys"
          [ "$keys" -gt 0 ]
          test ! -e uro_test.v1 && test ! -e priv/uro_test.v1

      - name: Control (without the extension, the suite cannot open its database)
        run: |
          if env -u URO_WEFTFDB_EXTENSION mix test > control.txt 2>&1; then
            cat control.txt; echo "the suite ran with no weft_fdb VFS registered"; exit 1
          fi
          grep -q "database_open_failed" control.txt

      - name: Cache Dialyzer PLTs
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-zone-backend-dialyzer-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-zone-backend-dialyzer-

      - name: Dialyzer
        run: mix dialyzer
